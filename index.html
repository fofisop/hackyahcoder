<!DOCTYPE html>
<head>
    
    
    <title>The penguin's dream</title>
    <style>
button {
    background-color: #9dd9f3;
    color:            #1f4e63;
    border: 2px solid #6bbbdc;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 16px;

    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
button:hover {
    background-color: #bce8f7;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(80, 150, 180, 0.25);
}
#promptThisFun {
    background-color: white;
     padding: 30px;
      margin: 80px auto;
    border-radius: 20px;
     box-shadow: 0 5px 15px rgba(80, 150, 180, 0.25);
}

body{
    background-color: #e6f7fc;

     text-align: center;
}

    </style>
</head>
<body>
    
    <div id="promptThisFun">
        <br> <br> <br> 
        <p>Welcome (or welcome back) to this interactive theatre themed comic! To read the next page, you need to memorize a line or a phrase like this one!

        </p>
         <h2 id="theLine"></h2>
  <button onclick="nextItFun()">I memorized it!</button>

</div>
<div id = "page1" style = "display:none ;">
    <img src="horsepenguin.png">
     <button onclick="showVtest()">Continue</button>

</div>
<div id = "page2" style = "display:none ;">
     <img src="pen.png">
      <button onclick="showVtest()">Continue</button>
</div>
<div id = "page3" style = "display:none ;">
     <img src="happynow.png">
      <button onclick="showVtest()">Continue</button>
</div>
<div id = "Testpage" style = "display:none ;">
     <h2>What was the line that you most recently memorized?</h2>
     <p>Remember to include capitalization and punctuation.</p>

    <input id="guess">

    <button onclick="checkAnswer()">Submit</button>
</div>
    <script>
        let prompts = [
            "A Penguin's dream",
            "Auditions are tough, but always worth it!",
            "My dream is to hit the stage, is it yours?"


        ];

        let pages = [
    "page1",
    "page2",
    "page3"
];
let current = 0;
function showVPrompt() {
    document.getElementById("theLine").textContent = prompts[current];

    document.getElementById("promptThisFun").style.display = "block";

      document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "none";
    document.getElementById("page3").style.display = "none";
       document.getElementById("Testpage").style.display = "none";

}
;

function nextItFun() {
    document.getElementById("promptThisFun").style.display = "none";
    document.getElementById(pages[current]).style.display = "block";
}
function showVtest() {
    document.getElementById(pages[current]).style.display = "none";
    document.getElementById("Testpage").style.display = "block";
}






function checkAnswer() {
    let guess = document.getElementById("guess").value.trim();

    if (guess.toLowerCase() === prompts[current].toLowerCase()) 
    {
         current++;

        if (current < prompts.length) {
            showVPrompt();
        } else {
            alert("You win!")
        }
            } else {
        alert("Wrong! Try again.");
    }
    };
    showVPrompt();

    </script>
</body>
</html>
